---
name: Public unit tests
run-name: Running public unit tests
on:
  push:
    branches:
      - main
jobs:
  ubuntu-default-compilers:
    strategy:
    matrix:
      # Define a custom object for each matrix tier
      environment:
        - name: github-default
          runner_group: Default
          os_label: ubuntu-24.04
        - name: arene
          runner_group: Arene
          os_label: arene-otemachi-arm64-ubuntu-22.04-256core

    runs-on:
      group: ${{ matrix.environment.runner_group }}
      labels: ${{ matrix.environment.os_label }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
      - name: Install libc++
        run: |
          sudo apt update
          sudo apt install -y libc++-dev libc++abi-dev
      - name: >
          Build and test //arene/base/... and //stdlib/... with default clang
          and libc++ on ${{ matrix.environment.name }} runner group
        run: |
          bazelisk \
            --bazelrc=.github/ci.bazelrc \
            test \
            --keep_going \
            --config=local_toolchain \
            --action_env=CC=clang \
            --copt=-stdlib=libc++ \
            --linkopt=-lc++ \
            -- \
            //:everything //arene/base/... //stdlib/...
